<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V.E.C.T.O.R - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>V.E.C.T.O.R</h1>
            <p class="tagline">AI Assistant</p>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Model:</span>
                <span class="stat-value" id="model-name">-</span>
            </div>
            <div class="stat">
                <span class="stat-label">Requests:</span>
                <span class="stat-value" id="total-requests">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Cached:</span>
                <span class="stat-value" id="cached-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Status:</span>
                <span class="stat-value status" id="status">Connecting...</span>
            </div>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="message system">
                <div class="message-content">Hello! I'm V.E.C.T.O.R, your AI assistant. Ask me anything!</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="question-input"
                    placeholder="Ask a question..."
                    rows="1"
                ></textarea>
                <button id="send-btn" class="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="options">
                <label>
                    <input type="checkbox" id="stream-toggle"> Streaming mode
                </label>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
