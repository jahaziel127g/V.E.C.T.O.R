[package]
name = "vector_rust"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.5"
actix-cors = "0.6"
actix-multipart = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "blocking", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
rand = "0.8"
chrono = "0.4"
parking_lot = "0.12"
sysinfo = "0.32"
moka = { version = "0.12", features = ["sync"] }
blake3 = "1.5"
uuid = { version = "1.0", features = ["v4"] }
num_cpus = "1.0"
